# .streamlit/config.toml

[theme]
base = "light"
primaryColor = "#4CAF50"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#000000"
font = "sans serif"

[server]
enableStaticServing = true
headless = true
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[ui]
hideMenu = true
hideToolbar = true
